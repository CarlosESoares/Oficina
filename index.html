
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Carrinho</title>

  <style>
    /* ===================================================== */
    /* CONFIGURAÇÃO DA PÁGINA                                */
    /* ===================================================== */

    body {
      margin: 0;
      background-color: lightblue;
      overflow: hidden;
    }

    /* ===================================================== */
    /* BOTÃO PARA PRÓXIMA PÁGINA                            */
    /* ===================================================== */

    .botao-proxima {
      position: fixed;
      top: 20px;
      right: 20px;

      padding: 12px 25px;

      background-color: blue;
      color: white;

      border: none;
      border-radius: 10px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
      text-decoration: none;

      z-index: 10;

      transition: 0.3s;
    }

    .botao-proxima:hover {
      background-color: darkblue;
      transform: scale(1.05);
    }

    /* ===================================================== */
    /* PISTA                                                  */
    /* ===================================================== */

    .pista {
      width: 100%;
      height: 250px;

      position: relative;
      overflow: hidden;

      margin-top: 50px;
    }

    /* ===================================================== */
    /* CENÁRIO DO CARRO                                       */
    /* ===================================================== */

    .cenario {
      width: 400px;
      height: 250px;

      position: absolute;

      top: 0;
      left: 0;

      z-index: 1;
    }

    /* ===================================================== */
    /* PARTE DE BAIXO DO CARRO                               */
    /* ===================================================== */

    .corpo-baixo {
      width: 300px;
      height: 60px;

      background-color: red;

      position: absolute;

      bottom: 40px;
      left: 50px;

      border-radius: 10px;
    }

    /* ===================================================== */
    /* PARTE DE CIMA DO CARRO                                */
    /* ===================================================== */

    .corpo-cima {
      width: 180px;
      height: 50px;

      background-color: darkred;

      position: absolute;

      bottom: 95px;
      left: 100px;

      border-radius: 10px 10px 0 0;
    }

    /* ===================================================== */
    /* JANELA DA FRENTE                                     */
    /* ===================================================== */

    .janela-frente {
      width: 55px;
      height: 35px;

      background-color: lightskyblue;

      position: absolute;

      bottom: 100px;
      left: 108px;

      border-radius: 5px;
    }

    /* ===================================================== */
    /* JANELA DE TRÁS                                       */
    /* ===================================================== */

    .janela-tras {
      width: 55px;
      height: 35px;

      background-color: lightskyblue;

      position: absolute;

      bottom: 100px;
      left: 208px;

      border-radius: 5px;
    }

    /* ===================================================== */
    /* COLUNA ENTRE AS JANELAS                               */
    /* ===================================================== */

    .coluna {
      width: 8px;
      height: 50px;

      background-color: darkred;

      position: absolute;

      bottom: 95px;
      left: 176px;
    }

    /* ===================================================== */
    /* FAROL                                                 */
    /* ===================================================== */

    .farol {
      width: 18px;
      height: 18px;

      background-color: yellow;

      position: absolute;

      bottom: 55px;
      left: 335px;

      border-radius: 50%;
    }

    /* ===================================================== */
    /* LANTERNA                                              */
    /* ===================================================== */

    .lanterna {
      width: 12px;
      height: 20px;

      background-color: orange;

      position: absolute;

      bottom: 55px;
      left: 45px;

      border-radius: 5px;
    }

    /* ===================================================== */
    /* PARA-CHOQUE                                           */
    /* ===================================================== */

    .para-choque {
      width: 300px;
      height: 12px;

      background-color: gray;

      position: absolute;

      bottom: 40px;
      left: 50px;

      border-radius: 0 0 10px 10px;
    }

    /* ===================================================== */
    /* PORTA                                                  */
    /* ===================================================== */

    .porta {
      width: 4px;
      height: 60px;

      background-color: darkred;

      position: absolute;

      bottom: 40px;
      left: 175px;
    }

    /* ===================================================== */
    /* ARO DA RODA ESQUERDA                                 */
    /* ===================================================== */

    .aro-esquerda {
      width: 20px;
      height: 20px;

      background-color: silver;

      position: absolute;

      bottom: 30px;
      left: 95px;

      border-radius: 50%;

      z-index: 2;
    }

    /* ===================================================== */
    /* ARO DA RODA DIREITA                                  */
    /* ===================================================== */

    .aro-direita {
      width: 20px;
      height: 20px;

      background-color: silver;

      position: absolute;

      bottom: 30px;
      left: 285px;

      border-radius: 50%;

      z-index: 2;
    }

    /* ===================================================== */
    /* RODA ESQUERDA                                        */
    /* ===================================================== */

    .roda-esquerda {
      width: 50px;
      height: 50px;

      background-color: black;

      position: absolute;

      bottom: 15px;
      left: 80px;

      border-radius: 50%;
    }

    /* ===================================================== */
    /* RODA DIREITA                                         */
    /* ===================================================== */

    .roda-direita {
      width: 50px;
      height: 50px;

      background-color: black;

      position: absolute;

      bottom: 15px;
      left: 270px;

      border-radius: 50%;
    }

    /* ===================================================== */
    /* ÁRVORE                                                */
    /* ===================================================== */

    .arvore {
      position: absolute;

      bottom: 15px;

      display: flex;
      flex-direction: column-reverse;
      align-items: center;

      z-index: 0;
    }

    /* ===================================================== */
    /* TRONCO                                                */
    /* ===================================================== */

    .tronco {
      width: 15px;
      height: 40px;

      background-color: saddlebrown;

      border-radius: 3px;
    }

    /* ===================================================== */
    /* COPA                                                  */
    /* ===================================================== */

    .copa {
      width: 60px;
      height: 60px;

      background-color: forestgreen;

      border-radius: 50%;

      margin-bottom: -10px;
    }

    /* ===================================================== */
    /* POSIÇÃO DAS ÁRVORES                                  */
    /* ===================================================== */

    .arvore-1 {
      left: 8%;
    }

    .arvore-2 {
      left: 32%;
    }

    .arvore-3 {
      left: 62%;
    }

    .arvore-4 {
      left: 85%;
    }

    /* ===================================================== */
    /* CHÃO                                                   */
    /* ===================================================== */

    .chao {
      width: 100%;
      height: 5px;

      background-color: green;

      position: absolute;

      bottom: 10px;
    }

  </style>
</head>

<body>

  <!-- ===================================================== -->
  <!-- BOTÃO PARA IR PARA Slide.html                         -->
  <!-- ===================================================== -->

 <button> <a href="Slide.html" class="botao-voltar">
  Ir para inicio
</a></button>


  <!-- ===================================================== -->
  <!-- PISTA                                                  -->
  <!-- ===================================================== -->

  <div class="pista">

    <!-- ÁRVORE 1 -->
    <div class="arvore arvore-1">
      <div class="tronco"></div>
      <div class="copa"></div>
    </div>

    <!-- ÁRVORE 2 -->
    <div class="arvore arvore-2">
      <div class="tronco"></div>
      <div class="copa"></div>
    </div>

    <!-- ÁRVORE 3 -->
    <div class="arvore arvore-3">
      <div class="tronco"></div>
      <div class="copa"></div>
    </div>

    <!-- ÁRVORE 4 -->
    <div class="arvore arvore-4">
      <div class="tronco"></div>
      <div class="copa"></div>
    </div>


    <!-- ===================================================== -->
    <!-- CENÁRIO DO CARRO                                     -->
    <!-- ===================================================== -->

    <div class="cenario">

      <!-- Parte de baixo do carro -->
      <div class="corpo-baixo"></div>

      <!-- Parte de cima do carro -->
      <div class="corpo-cima"></div>

      <!-- Janela da frente -->
      <div class="janela-frente"></div>

      <!-- Janela de trás -->
      <div class="janela-tras"></div>

      <!-- Coluna entre as janelas -->
      <div class="coluna"></div>

      <!-- Farol -->
      <div class="farol"></div>

      <!-- Lanterna -->
      <div class="lanterna"></div>

      <!-- Para-choque -->
      <div class="para-choque"></div>

      <!-- Porta -->
      <div class="porta"></div>

      <!-- Roda esquerda -->
      <div class="roda-esquerda"></div>

      <!-- Aro da roda esquerda -->
      <div class="aro-esquerda"></div>

      <!-- Roda direita -->
      <div class="roda-direita"></div>

      <!-- Aro da roda direita -->
      <div class="aro-direita"></div>

    </div>


    <!-- ===================================================== -->
    <!-- CHÃO                                                   -->
    <!-- ===================================================== -->

    <div class="chao"></div>

  </div>


  <!-- ===================================================== -->
  <!-- JAVASCRIPT - MOVIMENTO DO CARRO                       -->
  <!-- ===================================================== -->

  <script>

    // Pega o carro pela classe
    const carro = document.querySelector(".cenario");

    // Posição inicial
    let posicao = 0;

    // Função que movimenta o carro
    function moverCarro() {

      // Aumenta a posição
      posicao = posicao + 3;

      // Se o carro sair da tela pela direita
      if (posicao > window.innerWidth) {

        // Volta para a esquerda
        posicao = -400;
      }

      // Move o carro
      carro.style.left = posicao + "px";

      // Continua a animação
      requestAnimationFrame(moverCarro);
    }

    // Inicia o movimento
    moverCarro();

  </script>

</body>
</html>
